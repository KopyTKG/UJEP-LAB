version: "3.8"

services:
  # TimescaleDB - Time-series database for metrics storage
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: sysmon-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      # Database credentials (change these in production!)
      POSTGRES_USER: sysmon
      POSTGRES_PASSWORD: sysmon
      POSTGRES_DB: sysmon
      # TimescaleDB tuning
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      # Persistent data storage
      - timescaledb_data:/var/lib/postgresql/data
    networks:
      - sysmon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysmon"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: sysmon-grafana
    ports:
      - "9096:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:9096
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - sysmon
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timescaledb_data:
    name: sysmon_timescaledb_data
  grafana-data:
    name: sysmon_grafana_data

networks:
  sysmon:
    name: sysmon_network
    driver: bridge
