---
# Stage 9: PostgreSQL 16 + Patroni on both heads
#
# Patroni manages a 2-node PostgreSQL cluster using the etcd cluster from
# stage 8 as its distributed configuration store. On bootstrap, whichever
# head Patroni picks first becomes the leader and initdb's a fresh cluster;
# the other comes up as a streaming standby (pg_basebackup from the leader).
# Synchronous replication is enforced — primary blocks COMMIT until the
# standby has applied the WAL record. Zero data loss on failover, ~1-2 ms
# write latency overhead on IPoIB.
#
# After this runs:
#   - patroni service active on both heads
#   - One head is Leader, one is Sync Standby (see `patronictl list`)
#   - Database `opennebula` exists, owned by user `oneadmin`
#   - Patroni REST API on :8008, Postgres on :5432 (both bound to IPoIB)
#   - Failover: pull the network cable from leader → other head promoted
#     in ~30 s (configurable via dcs.ttl)
#
# Auto-failover: Patroni handles it. On leader loss, the remaining head +
# 3rd etcd voter (Rocky-Compute-1) re-elect via etcd Raft. No manual ops.

- name: PostgreSQL 16 + Patroni on heads
  hosts: patroni  # Rocky-Head-1, Rocky-Head-2
  become: yes

  vars:
    pg_version: 16
    pg_bin: /usr/pgsql-16/bin
    pg_data: /var/lib/pgsql/16/data

    patroni_scope: ujep-one
    pg_replication_password: "replicate-me-1d8f2c"  # internal cluster replication user
    pg_superuser_password: "pg-super-9a3f4b"        # postgres superuser
    pg_oneadmin_password: "ujep-one-init"           # OpenNebula's DB-level user
    pg_one_database: opennebula
    etcd_endpoints: "10.0.0.251:2379,10.0.0.252:2379,10.0.0.1:2379"

  tasks:
    # --- 1. Repos + packages ---
    - name: Install PostgreSQL.org repo (PGDG) for EL9
      dnf:
        name: https://download.postgresql.org/pub/repos/yum/reporpms/EL-9-x86_64/pgdg-redhat-repo-latest.noarch.rpm
        state: present
        disable_gpg_check: yes

    - name: Disable Rocky's postgresql module (so PGDG wins for `postgres` provides)
      command: dnf -y module disable postgresql
      register: mod_disable
      changed_when: "'Nothing to do' not in mod_disable.stdout"
      failed_when: false

    - name: Install PostgreSQL {{ pg_version }} + Patroni
      dnf:
        name:
          - "postgresql{{ pg_version }}-server"
          - "postgresql{{ pg_version }}-contrib"
          - python3-psycopg2     # for ansible community.postgresql modules
          - patroni              # from EPEL
          - patroni-etcd
        state: present

    # --- 2. Dirs + ownership ---
    - name: Ensure /var/lib/pgsql/{{ pg_version }} exists (Patroni will initdb into it)
      file:
        path: "/var/lib/pgsql/{{ pg_version }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

    - name: Ensure data dir exists (empty — Patroni initdb's it)
      file:
        path: "{{ pg_data }}"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

    - name: /etc/patroni
      file:
        path: /etc/patroni
        state: directory
        owner: postgres
        group: postgres
        mode: "0750"

    # --- 3. Patroni config ---
    - name: Write patroni.yml
      copy:
        dest: /etc/patroni/patroni.yml
        owner: postgres
        group: postgres
        mode: "0640"
        content: |
          # Managed by Ansible (stage9_patroni_postgres.yml)
          scope: {{ patroni_scope }}
          namespace: /service/
          name: {{ inventory_hostname | lower }}

          restapi:
            listen: 0.0.0.0:8008
            connect_address: {{ ib_ip }}:8008

          etcd3:
            hosts: {{ etcd_endpoints }}

          bootstrap:
            # Only consulted on the very first cluster init.  After that the
            # actual runtime values live in etcd and can be changed via
            # `patronictl edit-config`.
            dcs:
              ttl: 30
              loop_wait: 10
              retry_timeout: 10
              maximum_lag_on_failover: 1048576
              synchronous_mode: true
              synchronous_mode_strict: false   # false = allow leader to keep accepting writes if standby is gone (RTO over RPO)
              postgresql:
                use_pg_rewind: true
                use_slots: true
                parameters:
                  wal_level: replica
                  hot_standby: on
                  max_wal_senders: 10
                  max_replication_slots: 10
                  wal_keep_size: 1GB
                  synchronous_commit: remote_apply
                  max_connections: 1000

            initdb:
              - encoding: UTF8
              - data-checksums

            pg_hba:
              - local all all peer
              - host all all 127.0.0.1/32 md5
              - host all all 10.0.0.0/24 md5
              - host all all 192.168.1.0/24 md5
              - host replication replicator 10.0.0.0/24 md5

          postgresql:
            listen: 0.0.0.0:5432
            connect_address: {{ ib_ip }}:5432
            data_dir: {{ pg_data }}
            bin_dir: {{ pg_bin }}
            pgpass: /var/lib/pgsql/.pgpass
            authentication:
              replication:
                username: replicator
                password: {{ pg_replication_password }}
              superuser:
                username: postgres
                password: {{ pg_superuser_password }}

          tags:
            nofailover: false
            noloadbalance: false
            clonefrom: false
            nosync: false

    # --- 4. Firewall ---
    - name: Open Postgres + Patroni REST API ports
      firewalld:
        port: "{{ item }}"
        permanent: yes
        immediate: yes
        state: enabled
      loop:
        - 5432/tcp
        - 8008/tcp

    # --- 5. Start (staggered: leader first to win initdb race) ---
    - name: Enable Patroni
      systemd:
        name: patroni
        enabled: yes
        daemon_reload: yes

    - name: Start Patroni on Head-1 first (gets to initdb the cluster)
      systemd:
        name: patroni
        state: started
      when: inventory_hostname == 'Rocky-Head-1'

    - name: Wait for Head-1 leader to be promoted
      command: patronictl -c /etc/patroni/patroni.yml list
      register: head1_check
      retries: 30
      delay: 5
      until: head1_check.rc == 0 and 'Leader' in head1_check.stdout
      changed_when: false
      when: inventory_hostname == 'Rocky-Head-1'

    - name: Start Patroni on Head-2 (will replicate from Head-1 via pg_basebackup)
      systemd:
        name: patroni
        state: started
      when: inventory_hostname == 'Rocky-Head-2'


- name: Create OpenNebula DB + user
  hosts: Rocky-Head-1
  become: yes
  gather_facts: no

  vars:
    pg_oneadmin_password: "ujep-one-init"
    pg_one_database: opennebula

  tasks:
    - name: Wait for full cluster (leader + sync standby both healthy)
      shell: |
        patronictl -c /etc/patroni/patroni.yml list | awk 'NR>3' | grep -E 'running'
      register: cluster_state
      retries: 30
      delay: 5
      until: cluster_state.rc == 0 and (cluster_state.stdout_lines | length) >= 2
      changed_when: false

    - name: Create oneadmin Postgres role
      become_user: postgres
      community.postgresql.postgresql_user:
        name: oneadmin
        password: "{{ pg_oneadmin_password }}"
        state: present
        login_unix_socket: /var/run/postgresql

    - name: Create opennebula database owned by oneadmin
      become_user: postgres
      community.postgresql.postgresql_db:
        name: "{{ pg_one_database }}"
        owner: oneadmin
        encoding: UTF8
        lc_collate: en_US.UTF-8
        lc_ctype: en_US.UTF-8
        template: template0
        state: present
        login_unix_socket: /var/run/postgresql

    - name: Show cluster summary
      command: patronictl -c /etc/patroni/patroni.yml list
      register: final_state
      changed_when: false

    - name: Display
      debug:
        msg: |
          ============================================================
          PostgreSQL HA cluster ready
          ============================================================
          {{ final_state.stdout }}

          DB:       {{ pg_one_database }}
          DB user:  oneadmin (password: {{ pg_oneadmin_password }})

          Sync mode: ON  — leader waits for standby ACK before COMMIT
                         (zero data loss on failover)

          Connect from clients via:
            psql -h <leader-ip> -U oneadmin {{ pg_one_database }}

            ...but normally you go through the VIP (stage 10).

          Failover test:
            On the leader: sudo systemctl stop patroni
            Watch:         patronictl -c /etc/patroni/patroni.yml list
                          (other head should promote in ~30 s via etcd Raft)
          ============================================================
