---
# Bring OpenNebula back after a full shutdown (`just up` runs this after Lustre is up everywhere).
#
#   ansible-playbook playbooks/stage11_restore_stack.yml
#
# Since stage 20 oned runs on three frontends (Rocky-Head-1, Rocky-Head-2, Rocky-Compute-1) in a
# Raft cluster, each with its own local MariaDB; there is no Galera bootstrap any more. Steps:
#   1. MariaDB (standalone) answers on every frontend
#   2. oned and the services around it start on every frontend; the Raft leader takes the virtual IP
#   3. wait until the CLI answers through the virtual IP (a leader exists)
#   4. the hook managers reload (they start at boot before oned answers and would hold no hooks)
#   5. the monitoring agents on the hosts are restarted (oned does not start them by itself after
#      a restart), the VMs that `just down` powered off are resumed
# A majority (two of three frontends) is enough for step 3.

- name: Local databases
  hosts: one_frontends
  become: yes
  gather_facts: no
  tasks:
    - name: MariaDB started (standalone)
      systemd:
        name: mariadb
        state: started
        enabled: yes

    - name: MariaDB answers
      shell: mysql -uroot -BNe "select count(*) from opennebula.host_pool"
      register: db
      until: db.rc == 0
      retries: 20
      delay: 3
      changed_when: false

- name: oned on every frontend
  hosts: one_frontends
  become: yes
  gather_facts: no
  tasks:
    - name: Clear a start-rate limit from earlier failed starts
      command: systemctl reset-failed opennebula opennebula-scheduler opennebula-fireedge opennebula-flow opennebula-gate
      changed_when: false
      failed_when: false

    - name: Start oned and the services around it
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop: [opennebula, opennebula-scheduler, opennebula-fireedge, opennebula-flow, opennebula-gate]

- name: A leader answers through the virtual IP
  hosts: Rocky-Head-1
  become: yes
  gather_facts: no
  tasks:
    - name: oneuser list through the virtual IP (one_endpoint)
      become_user: oneadmin
      shell: oneuser list
      register: ol
      until: ol.rc == 0
      retries: 40
      delay: 5
      changed_when: false

    - name: Raft state
      become_user: oneadmin
      shell: onezone show 0 | sed -n '/SYNC STATUS/,$p' | head -6
      register: raft
      changed_when: false

    - debug:
        var: raft.stdout_lines

- name: Hook managers
  hosts: one_frontends
  become: yes
  gather_facts: no
  tasks:
    # opennebula-hem starts at boot while oned is still down ("Cannot get hook information",
    # onehem.log) and never reloads, so every hook (host_error) is silently ignored.
    - name: Restart the hook event manager now that oned answers
      systemd:
        name: opennebula-hem
        state: restarted

- name: Hosts and VMs
  hosts: Rocky-Head-1
  become: yes
  gather_facts: no
  tasks:
    # After the restart oned does not start the monitoring agents on its own (hosts stayed
    # without a monitoring time until `onehost sync`, 2026-10-29). The agents report to the
    # virtual IP (monitord.conf, stage 20).
    - name: Restart the monitoring agents on every host
      become_user: oneadmin
      environment:
        SSH_AUTH_SOCK: /var/run/one/ssh-agent.sock
      shell: onehost sync --force </dev/null
      changed_when: true

    # `just down` powers the running VMs off before it unmounts Lustre; bring them back.
    - name: Resume the VMs that the shutdown powered off
      become_user: oneadmin
      shell: |
        for v in $(onevm list -l ID,STAT --no-header </dev/null | awk '$2=="poff"{print $1}'); do
          onevm resume $v </dev/null
        done
      changed_when: true
