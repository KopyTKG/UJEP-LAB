---
# Stage 9: HAProxy + keepalived VIP for MariaDB Galera clients
#
# Galera is multi-primary (every node can accept writes), but OpenNebula's
# oned doesn't tolerate cross-node write conflicts well, so we use a
# single-active-writer pattern: HAProxy routes ALL connections to Head-1
# unless it's down, in which case it fails over to Head-2, then Compute-1.
# Clients see one endpoint:
#
#     192.168.1.249:3306  →  always reaches Head-1 (or first healthy alternate)
#
# Why this stage exists:
#   - Galera handles DB-layer HA on its own (wsrep consensus, 3-node quorum)
#   - But oned needs a single stable endpoint to talk to
#   - HAProxy with the `backup` flag on alternates gives us that: clients
#     don't care which node is currently "active" from a write perspective
#   - keepalived (VRRP) places the VIP itself on whichever head has its
#     local HAProxy alive
#
# Two failure domains, covered independently:
#   - Active Galera node dies   → HAProxy reroutes within seconds (TCP check)
#   - VIP-holder head dies      → keepalived raises VIP on other head (~1 s)

- name: HAProxy + keepalived VIP for MariaDB Galera
  hosts: opennebula_frontend  # Rocky-Head-1, Rocky-Head-2
  become: yes

  vars:
    db_vip: "192.168.1.249"
    db_vip_cidr: "192.168.1.249/24"
    vrrp_router_id: 52
    vrrp_auth_pass: "ujep-one-vrrp"
    mysql_port: 3306

  tasks:
    - name: Detect default ethernet interface (for VRRP binding)
      set_fact:
        vip_iface_detected: "{{ ansible_default_ipv4.interface }}"

    - name: Install HAProxy + keepalived
      dnf:
        name:
          - haproxy
          - keepalived
        state: present

    - name: HAProxy config — single-writer MariaDB Galera with TCP healthcheck
      copy:
        dest: /etc/haproxy/haproxy.cfg
        mode: "0644"
        content: |
          global
            log /dev/log local0
            maxconn 4096
            daemon

          defaults
            mode tcp
            log global
            option tcplog
            option dontlognull
            timeout connect 5s
            timeout client  30m
            timeout server  30m
            timeout check   3s

          # HAProxy stats — useful for spotting which Galera node is currently
          # serving and whether all 3 are healthy.
          listen stats
            bind *:7000
            mode http
            stats enable
            stats uri /
            stats refresh 5s

          listen mariadb_galera
            # Bind to the VIP only — MariaDB on each Galera node binds to its
            # own IPoIB IP, so port 3306 on 192.168.1.0/24 side is free for us.
            # ip_nonlocal_bind is enabled below so the standby head can pre-bind.
            bind {{ db_vip }}:{{ mysql_port }}
            mode tcp
            option tcp-check
            tcp-check connect
            default-server inter 3s fall 2 rise 2 on-marked-down shutdown-sessions
            # Single-writer pattern: head-1 is primary, others are warm backups.
            # When head-1 fails its TCP check, HAProxy promotes the next backup.
            server galera-head-1     10.0.0.251:{{ mysql_port }} check
            server galera-head-2     10.0.0.252:{{ mysql_port }} check backup
            server galera-compute-1  10.0.0.1:{{ mysql_port }}   check backup
      notify: restart haproxy

    - name: keepalived config
      copy:
        dest: /etc/keepalived/keepalived.conf
        mode: "0644"
        content: |
          vrrp_script chk_haproxy {
            script "/usr/bin/killall -0 haproxy"
            interval 2
            weight 2
            fall 2
            rise 2
          }

          vrrp_instance VI_DB {
            state {{ 'MASTER' if inventory_hostname == 'Rocky-Head-1' else 'BACKUP' }}
            interface {{ vip_iface_detected }}
            virtual_router_id {{ vrrp_router_id }}
            priority {{ 110 if inventory_hostname == 'Rocky-Head-1' else 100 }}
            advert_int 1
            authentication {
              auth_type PASS
              auth_pass {{ vrrp_auth_pass }}
            }
            virtual_ipaddress {
              {{ db_vip_cidr }}
            }
            track_script {
              chk_haproxy
            }
          }
      notify: restart keepalived

    - name: Open HAProxy + stats ports
      firewalld:
        port: "{{ item }}"
        permanent: yes
        immediate: yes
        state: enabled
      loop:
        - "{{ mysql_port }}/tcp"
        - 7000/tcp

    - name: Allow VRRP between heads
      shell: |
        firewall-cmd --permanent --add-rich-rule='rule protocol value="vrrp" accept'
        firewall-cmd --reload
      changed_when: true

    - name: Allow HAProxy to bind to non-local IP
      sysctl:
        name: net.ipv4.ip_nonlocal_bind
        value: "1"
        state: present
        sysctl_set: yes
        reload: yes

    - name: Enable + start HAProxy
      systemd:
        name: haproxy
        state: started
        enabled: yes

    - name: Enable + start keepalived
      systemd:
        name: keepalived
        state: started
        enabled: yes

  handlers:
    - name: restart haproxy
      systemd:
        name: haproxy
        state: restarted

    - name: restart keepalived
      systemd:
        name: keepalived
        state: restarted


- name: VIP verification
  hosts: Rocky-Head-1
  become: yes
  gather_facts: no
  tasks:
    - name: Wait for VIP to come up
      wait_for:
        host: "192.168.1.249"
        port: 3306
        timeout: 30

    - name: Test MariaDB via VIP (should reach the active Galera node = Head-1)
      shell: |
        mysql -h 192.168.1.249 -u oneadmin -p'ujep-one-init' -BNe "
          SELECT @@wsrep_node_name, @@hostname"
        echo '---cluster_size (STATUS not SYSVAR)---'
        mysql -h 192.168.1.249 -u oneadmin -p'ujep-one-init' -BNe "
          SHOW STATUS LIKE 'wsrep_cluster_size'"
      register: vip_test
      changed_when: false

    - name: Show VIP state + cluster
      shell: |
        ip -4 addr show | grep -E '192.168.1.249' || echo 'VIP not on this host'
        echo '---wsrep---'
        mysql -uroot -e "SHOW STATUS WHERE Variable_name IN (
          'wsrep_cluster_size',
          'wsrep_cluster_status',
          'wsrep_incoming_addresses');"
      register: vip_state
      changed_when: false

    - name: Display
      debug:
        msg: |
          ============================================================
          MariaDB VIP active
          ============================================================
          VIP test (via 192.168.1.249:3306):
            wsrep_node_name | cluster_size | hostname
            {{ vip_test.stdout }}

          {{ vip_state.stdout }}

          OpenNebula's oned.conf (stage 10) will point at:
            SERVER = "192.168.1.249", PORT = 3306, BACKEND = "mysql"

          Failover paths covered:
            - Active Galera node dies   → HAProxy promotes next backup (~6 s = 2 checks × 3 s)
            - VIP-holder head dies      → keepalived raises VIP on other head (~1 s)
          ============================================================
