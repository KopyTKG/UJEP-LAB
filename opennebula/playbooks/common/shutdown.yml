---
# Graceful shutdown in dependency order (the old version shut the heads down first, so the
# computes' `umount /mnt/lustre` hung for minutes against dead servers, serially on 8 nodes;
# thesis note 15, 2026-10-08):
#   1. every node unmounts its Lustre client while all servers are still up
#   2. computes (OSS) power off together, then we wait until they are gone
#   3. heads power off one at a time, Head-2 (MDT1) first, Head-1 (MGS + MDT0) last
# Step 0 (added 2026-10-29): power the running VMs off first, so qemu closes its disks on
# Lustre before the clients unmount (the computes were slow to power off with VMs running).
# `just up` resumes them.

- name: 0. Power off the running VMs
  hosts: Rocky-Head-1
  become: yes
  tasks:
    - name: onevm poweroff, then wait until no VM is running
      shell: |
        sudo -u oneadmin bash -c '
          for v in $(onevm list -l ID,STAT --no-header </dev/null | awk "\$2==\"runn\"{print \$1}"); do
            onevm poweroff $v </dev/null
          done
          left() { onevm list -l STAT --no-header </dev/null | grep -cE "runn|shut"; }
          # wait for the ACPI shutdown to finish (state POWEROFF), not just for "not running":
          # on 2026-10-29 the VMs sat in SHUTDOWN_POWEROFF when libvirt was stopped, never reached
          # POWEROFF and the resume after the next start skipped them
          for i in $(seq 1 18); do n=$(left); [ "$n" -eq 0 ] && break; sleep 5; done
          if [ "$n" -ne 0 ]; then
            for v in $(onevm list -l ID,STAT --no-header </dev/null | awk "\$2==\"runn\"||\$2==\"shut\"{print \$1}"); do
              onevm poweroff --hard $v </dev/null
            done
            for i in $(seq 1 12); do n=$(left); [ "$n" -eq 0 ] && break; sleep 5; done
          fi
          echo "running VMs left: $n"'
      register: vm_off
      failed_when: false
      changed_when: true
    - debug:
        msg: "{{ vm_off.stdout_lines | default([]) | last | default('oned not reachable, skipped') }}"

- name: 1. Unmount the Lustre client everywhere (servers still up)
  hosts: cluster
  become: yes
  tasks:
    # A lazy `umount -l /mnt/lustre` leaves the datastore bind mount holding the Lustre client
    # superblock; systemd then unmounts it at poweroff after the servers (on Head-1 even its own
    # MDT) are gone and the shutdown hangs until the power is cut (Head-1, 2026-10-29, journal of
    # the hung boot: "Unmounting /var/lib/one/datastores..." and never "Unmounted"). So release
    # everything that holds files on Lustre and unmount for real while the servers still answer.
    - name: Stop the services that hold files on Lustre
      shell: systemctl stop opennebula-scheduler opennebula opennebula-hem libvirtd virtqemud.socket virtqemud 2>/dev/null; true
      changed_when: false

    - name: Unmount the datastore bind mount
      command: timeout 120 umount /var/lib/one/datastores
      register: bind_result
      failed_when: false
      changed_when: bind_result.rc == 0

    - name: Unmount /mnt/lustre (lazy only as a fallback)
      shell: timeout 120 umount /mnt/lustre || timeout 120 umount -l /mnt/lustre
      register: umount_result
      failed_when: false
      changed_when: umount_result.rc == 0

- name: 2. Power off the computes (OSS) together
  hosts: compute
  become: yes
  tasks:
    - name: Shutdown the node
      community.general.shutdown:
        delay: 1

    - name: Wait until the node no longer answers SSH
      wait_for:
        host: "{{ ansible_host }}"
        port: 22
        state: stopped
        delay: 5
        timeout: 300
      delegate_to: localhost
      become: no

- name: 3. Power off the heads, Head-1 (MGS + MDT0) last
  hosts: controller
  become: yes
  serial: 1
  order: reverse_inventory
  tasks:
    - name: Shutdown the node
      community.general.shutdown:
        delay: 1
