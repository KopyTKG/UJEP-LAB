Rocky-Head-2 ansible_host=192.168.1.252 ipmi_host=192.168.50.10

[compute]
Rocky-Compute-1 ansible_host=192.168.1.101 ipmi_host=192.168.50.1
Rocky-Compute-2 ansible_host=192.168.1.102 ipmi_host=192.168.50.2
Rocky-Compute-3 ansible_host=192.168.1.103 ipmi_host=192.168.50.3
Rocky-Compute-4 ansible_host=192.168.1.104 ipmi_host=192.168.50.4
Rocky-Compute-5 ansible_host=192.168.1.105 ipmi_host=192.168.50.5
Rocky-Compute-6 ansible_host=192.168.1.106 ipmi_host=192.168.50.6
Rocky-Compute-7 ansible_host=192.168.1.107 ipmi_host=192.168.50.7
Rocky-Compute-8 ansible_host=192.168.1.108 ipmi_host=192.168.50.8

# Lustre-specific role groups
[mgs]
Rocky-Head-1

[mds]
Rocky-Head-1
Rocky-Head-2

[oss]
Rocky-Compute-1
Rocky-Compute-2
Rocky-Compute-3
Rocky-Compute-4
Rocky-Compute-5
Rocky-Compute-6
Rocky-Compute-7
Rocky-Compute-8

[lustre_clients]
Rocky-Compute-1
Rocky-Compute-2
Rocky-Compute-3
Rocky-Compute-4
Rocky-Compute-5
Rocky-Compute-6
Rocky-Compute-7
Rocky-Compute-8

# OpenNebula-specific role groups
[opennebula_frontend]
Rocky-Head-1
Rocky-Head-2

[opennebula_kvm]
Rocky-Compute-1
Rocky-Compute-2
Rocky-Compute-3
Rocky-Compute-4
Rocky-Compute-5
Rocky-Compute-6
Rocky-Compute-7
Rocky-Compute-8

# 3-node etcd cluster for Patroni's DCS — 2 heads + 1 compute for quorum
[etcd_cluster]
Rocky-Head-1
Rocky-Head-2
Rocky-Compute-1

# PostgreSQL + Patroni runs on both heads
[patroni]
Rocky-Head-1
Rocky-Head-2

[cluster:children]
controller
compute

[cluster:vars]
ipmi_user=ADMIN
ansible_user=user
ansible_become=true
ansible_ssh_private_key_file=~/.ssh/ujep_lab
ib_ip=10.0.0.{{ ansible_host.split('.')[3] }}

# Lustre configuration
lustre_version=2.17.0
fsname=lustrefs
