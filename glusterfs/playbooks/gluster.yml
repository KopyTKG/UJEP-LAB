---
- name: Cluster Basic Setup & Networking
  hosts: all
  become: yes

  vars:
    ib_node_id: >-
      {{ 
        ansible_host.split('.')[-1] 
        if 'controller' in group_names 
        else inventory_hostname | regex_search('[0-9]+$') 
      }}

  tasks:
    # --- 1. FIREWALL & TIME ---
    - name: Configure Firewall (Allow NTP)
      ansible.posix.firewalld:
        service: ntp
        permanent: yes
        state: enabled
        immediate: yes

    - name: Configure Chrony (CESNET servers)
      copy:
        dest: /etc/chrony.conf
        content: |
          server tik.cesnet.cz iburst
          server tak.cesnet.cz iburst
          sourcedir /run/chrony-dhcp
          driftfile /var/lib/chrony/drift
          makestep 1.0 3
          rtcsync
          logdir /var/log/chrony
      notify: Restart chronyd

    # --- 2. KERNEL MODULES ---
    - name: Persist ib_ipoib kernel module
      copy:
        dest: /etc/modules-load.d/ib_ipoib.conf
        content: "ib_ipoib\n"
        mode: "0644"

    - name: Load ib_ipoib module immediately
      community.general.modprobe:
        name: ib_ipoib
        state: present

    # --- 3. INFINIBAND NETWORKING ---
    - name: Configure InfiniBand Interface (ibs1)
      community.general.nmcli:
        conn_name: ibs1
        ifname: ibs1
        type: infiniband
        ip4: "10.0.0.{{ ib_node_id }}/24"
        method4: manual
        autoconnect: yes
        state: present

    - name: Install opensm package
      dnf:
        name: opensm
        state: present

    - name: Ensure opensm service is enabled and started
      service:
        name: opensm
        state: started
        enabled: yes

    # --- 1. RESET HOSTS FILE (SAFE WIPE) ---
    - name: Reset /etc/hosts to minimal default
      copy:
        dest: /etc/hosts
        content: |
          127.0.0.1   localhost localhost.localdomain localhost4 localhost4.localdomain4
          ::1         localhost localhost.localdomain localhost6 localhost6.localdomain6

          # --- ANSIBLE MANAGED BLOCK BELOW ---

    # --- 2. POPULATE WITH CLUSTER INVENTORY ---
    - name: Populate /etc/hosts with InfiniBand IPs
      lineinfile:
        path: /etc/hosts
        line: >-
          10.0.0.{{ 
            hostvars[item].ansible_host.split('.')[-1] 
            if item in groups['controller'] 
            else item | regex_search('[0-9]+$') 
          }}   {{ item }}
        state: present
      loop: "{{ groups['all'] }}"
      when: hostvars[item].ansible_host is defined

    # --- 3. ADD MORE WEIGHT TO DEFAULT ROUTE ON eno2 ---
    - name: Add higher metric to eno2 default route
      ansible.builtin.command: nmcli connection modify eno2 ipv4.route-metric 200
      notify: Restart NetworkManager

    # --- 4. ENABLE DEFAULT ROUTE ON eno2 ---
    - name: Enable default route on eno2
      ansible.builtin.command: nmcli connection modify eno2 ipv4.never-default no
      notify: Restart NetworkManager

  handlers:
    - name: Restart chronyd
      service:
        name: chronyd
        state: restarted

    - name: Restart NetworkManager
      service:
        name: NetworkManager
        state: restarted

- name: Prepare Compute Nodes SSDs for glusterfs
  hosts: compute
  become: yes
  vars:
    target_model_string: "MZ7TY256"
    target_folder: "/data/glusterfs"

  tasks:
    # --- 1. DISCOVER THE DISK ID ---
    - name: Find the stable disk ID for Samsung 256GB SSD
      shell: "ls /dev/disk/by-id/ata-*{{ target_model_string }}* | grep -v part | head -n 1"
      register: disk_lookup
      changed_when: false
      failed_when: disk_lookup.stdout == ""

    - name: Set target_disk variable
      set_fact:
        target_disk: "{{ disk_lookup.stdout }}"

    # --- 2. CLEAR ---
    - name: Wipe filesystem signatures
      command: wipefs -af {{ target_disk }}
      ignore_errors: yes

    # --- 3. CREATE MOUNT FORLDER ---
    - name: Create glusterfs data directory
      ansible.builtin.file:
        path: "{{ target_folder }}"
        state: directory
        mode: "0755"

    # --- 4. FORMAT TO XFS ---
    # 4.0 Initialize the list as empty before the loop starts
    - name: Initialize storage_drives list
      set_fact:
        storage_drives: []

    # 4.1 Find drives by ID
    - name: Find Samsung 256GB SSDs (By-ID)
      set_fact:
        storage_drives: "{{ storage_drives + ['/dev/disk/by-id/' + (item.value.links.ids | select('match', '^ata-') | first)] }}"
      loop: "{{ ansible_devices | dict2items }}"
      when:
        - target_model_string in (item.value.model | default('') | string)
        - item.value.links.ids is defined
        - (item.value.links.ids | select('match', '^ata-') | list | length) > 0

    # 4.2 Actually Format the drives found as XFS
    - name: Create XFS filesystem on each drive
      community.general.filesystem:
        fstype: xfs
        dev: "{{ item }}"
        force: yes
      loop: "{{ storage_drives }}"

    # --- 5. MOUNT ---

    # 5.1 Create mount folders for each drive
    - name: Create mount directories
      ansible.builtin.file:
        path: "{{ target_folder }}/volume_{{ my_idx }}"
        state: directory
        mode: "0755"
      loop: "{{ storage_drives }}"
      loop_control:
        index_var: my_idx

    # 5.2 Mount formatted disk
    # Changed src from "{{ item }}1" to "{{ item }}-part1"
    - name: Mount formatted disk to glusterfs folder
      mount:
        path: "{{ target_folder }}/volume_{{ my_idx }}"
        src: "{{ item }}"
        fstype: xfs
        opts: defaults,noatime
        state: mounted
      loop: "{{ storage_drives }}"
      loop_control:
        index_var: my_idx
