---
# Stage 13: Self-signed TLS + Headlamp dashboard
# Generates a lab CA + wildcard cert for *.lab.local and exposes Headlamp via Ingress.
# Headlamp is a CNCF Sandbox dashboard project, used here instead of kubernetes-dashboard
# because the upstream kubernetes-dashboard helm repo at kubernetes.github.io/dashboard/
# is dead (404) — same issue that prompted the K3s -> kubeadm pivot earlier.

- name: Generate TLS + deploy Headlamp
  hosts: Rocky-Head-1
  become: yes

  vars:
    cert_dir: /etc/kubernetes/lab-tls
    lab_domain: lab.local
    cert_days: 3650
    dashboard_namespace: headlamp
    dashboard_chart_url: "https://kubernetes-sigs.github.io/headlamp/"

  tasks:
    # --- 1. CA + WILDCARD CERT ---
    - name: Create cert dir
      file:
        path: "{{ cert_dir }}"
        state: directory
        mode: "0700"

    - name: Generate CA key
      command: openssl genrsa -out {{ cert_dir }}/ca.key 4096
      args:
        creates: "{{ cert_dir }}/ca.key"

    - name: Generate CA cert
      command: >
        openssl req -x509 -new -nodes
        -key {{ cert_dir }}/ca.key
        -sha256 -days {{ cert_days }}
        -out {{ cert_dir }}/ca.crt
        -subj "/CN=UJEP-Lab-CA/O=UJEP-Lab"
      args:
        creates: "{{ cert_dir }}/ca.crt"

    - name: Generate server key
      command: openssl genrsa -out {{ cert_dir }}/tls.key 2048
      args:
        creates: "{{ cert_dir }}/tls.key"

    - name: Write SAN config
      copy:
        dest: "{{ cert_dir }}/san.cnf"
        mode: "0644"
        content: |
          [req]
          distinguished_name = req_dn
          req_extensions = v3_req
          prompt = no

          [req_dn]
          CN = *.{{ lab_domain }}
          O = UJEP-Lab

          [v3_req]
          subjectAltName = @alt_names

          [alt_names]
          DNS.1 = *.{{ lab_domain }}
          DNS.2 = dashboard.{{ lab_domain }}
          DNS.3 = grafana.{{ lab_domain }}
          DNS.4 = prometheus.{{ lab_domain }}
          IP.1 = 192.168.1.200
          IP.2 = 192.168.1.201
          IP.3 = 192.168.1.202

    - name: Generate CSR
      command: >
        openssl req -new
        -key {{ cert_dir }}/tls.key
        -out {{ cert_dir }}/tls.csr
        -config {{ cert_dir }}/san.cnf
      args:
        creates: "{{ cert_dir }}/tls.csr"

    - name: Sign server cert
      command: >
        openssl x509 -req
        -in {{ cert_dir }}/tls.csr
        -CA {{ cert_dir }}/ca.crt
        -CAkey {{ cert_dir }}/ca.key
        -CAcreateserial
        -out {{ cert_dir }}/tls.crt
        -days 730 -sha256
        -extensions v3_req
        -extfile {{ cert_dir }}/san.cnf
      args:
        creates: "{{ cert_dir }}/tls.crt"

    # --- 2. INSTALL HELM (used here + stage 14) ---
    # The upstream get-helm-3 install script has a PATH-validation step that false-negatives
    # in non-interactive shells (helm gets installed but the script's `command -v helm`
    # check fails and exits 1). Install via direct tarball instead.
    - name: Check for helm
      stat:
        path: /usr/local/bin/helm
      register: helm_bin

    - name: Install Helm (direct tarball)
      shell: |
        set -e
        cd /tmp
        curl -fsSL https://get.helm.sh/helm-v3.20.2-linux-amd64.tar.gz -o helm.tgz
        tar -xzf helm.tgz
        install -m 0755 linux-amd64/helm /usr/local/bin/helm
        rm -rf helm.tgz linux-amd64
      args:
        executable: /bin/bash
      when: not helm_bin.stat.exists

    - name: Symlink helm into /usr/bin (ansible's non-login shell PATH lacks /usr/local/bin)
      file:
        src: /usr/local/bin/helm
        dest: /usr/bin/helm
        state: link
        force: yes

    # --- 3. DASHBOARD VIA HELM ---
    - name: Add Headlamp helm repo
      command: helm repo add headlamp {{ dashboard_chart_url }}
      register: helm_add
      failed_when: helm_add.rc != 0 and 'already exists' not in helm_add.stderr
      changed_when: "'has been added' in helm_add.stdout"

    - name: Update helm repos
      command: helm repo update

    - name: Install Headlamp chart
      command: >
        helm upgrade --install headlamp headlamp/headlamp
        --namespace {{ dashboard_namespace }}
        --create-namespace

    - name: Wait for Headlamp pod
      command: >
        kubectl wait --for=condition=ready pod
        -l app.kubernetes.io/name=headlamp
        -n {{ dashboard_namespace }} --timeout=180s
      retries: 5
      delay: 10
      register: dash_ready
      until: dash_ready.rc == 0

    # --- 4. TLS SECRETS ---
    - name: Create lab-tls secret in default
      shell: >
        kubectl create secret tls lab-tls
        --cert={{ cert_dir }}/tls.crt
        --key={{ cert_dir }}/tls.key
        -n default --dry-run=client -o yaml |
        kubectl apply -f -

    - name: Create lab-tls secret in headlamp ns
      shell: >
        kubectl create secret tls lab-tls
        --cert={{ cert_dir }}/tls.crt
        --key={{ cert_dir }}/tls.key
        -n {{ dashboard_namespace }} --dry-run=client -o yaml |
        kubectl apply -f -

    # --- 5. INGRESS ---
    - name: Detect Headlamp service name
      shell: >
        kubectl get svc -n {{ dashboard_namespace }}
        -l app.kubernetes.io/name=headlamp
        -o jsonpath='{.items[0].metadata.name}'
      register: headlamp_svc
      changed_when: false

    - name: Detect Headlamp service port
      shell: >
        kubectl get svc -n {{ dashboard_namespace }}
        -l app.kubernetes.io/name=headlamp
        -o jsonpath='{.items[0].spec.ports[0].port}'
      register: headlamp_port
      changed_when: false

    - name: Apply Headlamp Ingress
      copy:
        dest: /root/headlamp-ingress.yaml
        mode: "0644"
        content: |
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: headlamp
            namespace: {{ dashboard_namespace }}
          spec:
            ingressClassName: nginx
            tls:
              - hosts:
                  - dashboard.{{ lab_domain }}
                secretName: lab-tls
            rules:
              - host: dashboard.{{ lab_domain }}
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: {{ headlamp_svc.stdout }}
                          port:
                            number: {{ headlamp_port.stdout }}

    - name: kubectl apply ingress
      command: kubectl apply -f /root/headlamp-ingress.yaml

    # --- 6. ADMIN TOKEN ---
    - name: Create admin-user ServiceAccount
      shell: |
        kubectl create serviceaccount admin-user -n {{ dashboard_namespace }} --dry-run=client -o yaml | kubectl apply -f -

    - name: Bind admin-user to cluster-admin
      copy:
        dest: /root/dashboard-admin.yaml
        mode: "0644"
        content: |
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: admin-user
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: cluster-admin
          subjects:
            - kind: ServiceAccount
              name: admin-user
              namespace: {{ dashboard_namespace }}

    - name: kubectl apply admin binding
      command: kubectl apply -f /root/dashboard-admin.yaml

    - name: Issue 1-year admin token
      command: kubectl create token admin-user -n {{ dashboard_namespace }} --duration=8760h
      register: admin_token
      changed_when: false

    - name: Show access info
      debug:
        msg: |
          ============================================================
          Headlamp Ready
          ============================================================
          URL: https://dashboard.{{ lab_domain }}
          CA: {{ cert_dir }}/ca.crt  (import into your browser/system trust)

          Add to /etc/hosts on your workstation:
            192.168.1.200  dashboard.{{ lab_domain }}

          Admin token (valid 1 year — paste into Headlamp's "Token" login):
          {{ admin_token.stdout }}
          ============================================================
